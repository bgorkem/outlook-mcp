# Tag-triggered release workflow.
#
# To use this for the first time you must ALSO configure an OIDC Trusted
# Publisher on npmjs.com pointing at this exact workflow:
#   https://www.npmjs.com/package/@bgorkem/outlook-mcp/access
#   -> Settings tab -> Trusted Publisher -> Add publisher (GitHub Actions)
#       Org/user:  bgorkem
#       Repo:      outlook-mcp
#       Workflow:  release.yml
#       Environment: (leave blank)
#
# Until that's set, npm publish will fail with "Trusted Publisher is not
# configured for this package". The first publish of a package always has
# to be done manually from a logged-in machine; trusted publishing only
# works once the package exists.
#
# Release flow once OIDC is wired up:
#
#   npm version patch -m "Release v%s"   # bumps + commits + tags
#   git push --follow-tags               # pushes the commit AND the new tag
#
# This workflow then: runs full CI, verifies tag matches package.json,
# publishes to npm with --provenance, and creates a GitHub Release with
# auto-generated notes.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to (re)release, e.g. v0.1.2"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # required to create a GitHub Release
      id-token: write       # required for OIDC trusted publishing to npm
    steps:
      - name: Resolve ref
        id: ref
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0    # full history for the auto-generated release notes

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify package version matches git tag
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${{ steps.ref.outputs.version }}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Package version $PKG does not match git tag $TAG"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          name: ${{ steps.ref.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Published as [`@bgorkem/outlook-mcp@${{ steps.ref.outputs.version }}`](https://www.npmjs.com/package/@bgorkem/outlook-mcp/v/${{ steps.ref.outputs.version }}) on npm with provenance.

            ## Install

            ```sh
            npx -y @bgorkem/outlook-mcp@${{ steps.ref.outputs.version }} --help
            ```
